[flake8]
max-line-length = 88
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    migrations,
    node_modules,
    staticfiles,
    media
per-file-ignores =
    # Allow unused imports in __init__.py re-export files
    __init__.py:F401

[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.local
python_files = tests.py test_*.py *_tests.py
addopts = -v
markers =
    cross_tenant: tests that verify tenant isolation behavior
