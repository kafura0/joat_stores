services:
  - type: web
    name: joat-stores-api
    env: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://joat-storefront.vercel.app,https://joat-admin.vercel.app
      # Set these manually in Render dashboard after creating Supabase + Upstash:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      # Optional — leave blank to use console email backend
      - key: EMAIL_HOST
        value: ""
      - key: EMAIL_HOST_USER
        value: ""
      - key: EMAIL_HOST_PASSWORD
        value: ""
      # M-Pesa sandbox creds (replace with live for production)
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        value: bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_WEBHOOK_SECRET
        generateValue: true
      - key: MPESA_INITIATOR_NAME
        value: testapi
      - key: MPESA_SECURITY_CREDENTIAL
        value: ""

  - type: worker
    name: joat-stores-celery
    env: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements/production.txt
    startCommand: celery -A config.celery_app worker -l info -Q order.notifications,inventory.alerts,billing.reminders,payments.reconciliation,analytics.reports --concurrency=1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: DJANGO_SECRET_KEY
        fromService:
          name: joat-stores-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
