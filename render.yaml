services:
  - type: web
    name: joat-stores-api
    env: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput && python fix_migration.py && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.10
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: PLATFORM_SUBDOMAINS
        value: admin.joat.com,api.joat.com,localhost,127.0.0.1,joat-stores-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://joat-stores-storefront.vercel.app,https://joat-stores-admin.vercel.app
      # ── Required: Set these in Render dashboard after creating accounts ──
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      # Email — leave blank to use console backend (logs only)
      - key: EMAIL_HOST
        value: ""
      - key: EMAIL_HOST_USER
        value: ""
      - key: EMAIL_HOST_PASSWORD
        value: ""
      # M-Pesa — set in dashboard
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        value: bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_WEBHOOK_SECRET
        generateValue: true
      # Twilio (optional) — leave blank to disable WhatsApp
      - key: TWILIO_ACCOUNT_SID
        value: ""
      - key: TWILIO_AUTH_TOKEN
        value: ""
      - key: TWILIO_WHATSAPP_FROM
        value: ""
      # QR code signing
      - key: HMAC_QR_SECRET
        generateValue: true
      # Internal cron endpoint (Upstash QStash)
      - key: CRON_SECRET
        generateValue: true
      # Upstash QStash signing key (for signature verification)
      - key: QSTASH_SIGNING_KEY
        value: ""
      # WhatsApp webhook
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        generateValue: true
